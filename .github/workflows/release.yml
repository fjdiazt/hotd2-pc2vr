name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install 32-bit MinGW
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Select 32-bit compiler
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\mingw32\bin"
      - name: Build and run offline checks
        run: ./build.ps1
      - name: Test font extraction, launcher and packaging
        run: |
          python -m unittest discover -s tests -p test_menu_font.py
          if ($LASTEXITCODE) { throw 'Font extraction tests failed.' }
          python -m unittest discover -s tests -p test_native_startup.py
          if ($LASTEXITCODE) { throw 'Native startup tests failed.' }
          python -m unittest discover -s tests -p test_launch_cli.py
          if ($LASTEXITCODE) { throw 'Launcher tests failed.' }
          python -m unittest discover -s tests -p test_package.py
          if ($LASTEXITCODE) { throw 'Packaging tests failed.' }
      - name: Package runtime
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "test-$env:GITHUB_RUN_ID" }
          ./package.ps1 -Version $version
      - name: Save package for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HOTD2-PC2VR-windows-x64
          path: |
            build-artifacts/releases/*.zip
            build-artifacts/releases/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(Get-ChildItem build-artifacts/releases -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files
          if ($LASTEXITCODE) { throw 'Release asset upload failed.' }
