[vr]
; Left stick click toggles native-font VR settings. Edited keys save on close.
menu=1
; Independent outputs. Native game window remains available in every combination.
; window: existing reconstructed desktop preview. vrwindow: headset rendering.
window=0
vrwindow=1
; Advanced graphics: native lights, material shading, specular and fog.
; 0 restores the earlier unlit conversion and skips CPU lighting calculations.
native_lighting=1
; Preserve expanded enemy/body mesh submission beyond the flat screen sides.
; 0 restores native mesh culling. Near/far/custom rejection remains for actors.
expand_meshes=1
; Experimental: capture loaded static stage scenery around/behind the camera.
; 0 keeps native stage visibility; this does not cache unloaded sections.
expand_world=1
; Scene brightness in percent, 25..400; 100 neutral. HUD and guns stay unchanged.
brightness=90
; Game audio percent, 0..100: 0 mutes, 100 keeps original level.
; Master multiplies each category. Effects include gunshots and voices.
master_volume=100
music_volume=100
effects_volume=100
; World size multiplier, 0.1..10. 1 restores the original size.
worldscale=1.25
; VR gun laser (beam/flare) and crosshair (hit marker), independently enabled.
laser=1
crosshair=1
gunmodel=gun.obj
gunscale=100
depth=2
depthbias=0
; 1: both guns from startup, either Start joins both players.
; 0: each hand joins its own player; guns follow native active-player status.
akimbo=1
; Move converted ammo/lives groups to match the gun hand, independently of akimbo.
; P1 right, P2 left; native desktop HUD stays original.
swap_player_hud=1
; Experimental Autosave; records scene changes and resumes on the next new Arcade start.
; Saves only stage/scene in HOTD2VR.checkpoint.ini beside the bridge, not exact game state.
; Live toggle: VR Settings > Advanced > Autosave. Save game / Load game also work when off.
continue_game=0
autozoom=0
msaa=4
supersample=100
gamma=220
haptic=1
focusgame=1
; Optional cheats for both players. CLI flags enable these for one launch.
; While viewer connected, cheat values override native settings: 0 off, 1 on.
infinite_lives=0
; Block native damage and hit/shake reactions; enemies still attack.
invincibility=0
; Native free play: unlimited joins/continues.
infinite_continues=0
infinite_ammo=0
; Repeat held-trigger shots; native weapon handling still applies.
rapid_fire=0
; Shots/sec when rapid_fire=1. Integer 1..30; default 4.
rapid_fire_rate=4

[bridge]
; Skip SEGA/Empire startup logos; 0 restores the original boot sequence.
skip_splash=1
; Select the game's native 640x480 windowed mode in memory. 0 keeps fullscreen.
windowed=1
; Keep rendering when the viewer or VR runtime has foreground focus.
background=1
; Initial unit conversion; real scale needs headset calibration.
units_per_metre=10
